<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
<title>Character Gallery</title>
<style>
  :root { --bg: #f7f6fb; --fg: #1c1a26; --muted: #6b6880; --line: rgba(0,0,0,.08); }
  @media (prefers-color-scheme: dark) { :root { --bg: #15141c; --fg: #f1eff8; --muted: #a29fb5; --line: rgba(255,255,255,.1); } }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--fg); font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  p { color: var(--muted); margin: 0 0 20px; }
  table { border-collapse: collapse; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; padding: 4px 6px; text-align: center; }
  th.row { text-align: left; color: var(--fg); font-size: 14px; padding-right: 14px; }
  td { border-top: 1px solid var(--line); padding: 0; }
  canvas { width: 104px; height: 104px; display: block; }
  .hero { display: flex; gap: 8px; margin-bottom: 24px; }
  .hero canvas { width: 150px; height: 150px; }
  .hero figure { margin: 0; text-align: center; }
  .hero figcaption { font-weight: 600; }
  .hero small { display: block; color: var(--muted); font-weight: 400; }
</style>
</head>
<body>
  <h1>Halo characters</h1>
  <p>Top row follows your cursor. The grid shows every character in every state.</p>
  <div class="hero" id="hero"></div>
  <table id="grid"></table>
  <script type="module" src="./gallery.js"></script>
</body>
</html>
