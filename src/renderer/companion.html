<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
<title>Halo</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; cursor: grab; transform-origin: 130px 214px; transition: transform .18s ease-out; }
  #stage.dragging { cursor: grabbing; }
  #bubble {
    position: absolute; left: 50%; transform: translateX(-50%) translateY(8px) scale(.94);
    bottom: 0; width: max-content; max-width: 236px; min-width: 132px; box-sizing: border-box; /* max-content: left: 50% alone would squeeze it to 132px */
    padding: 10px 14px 11px; border-radius: 18px; overflow: hidden;
    background: #1B1C21; color: #ECEDF1;
    box-shadow: 0 8px 26px rgba(0,0,0,.45), inset 0 0 0 1px rgba(255,255,255,.08);
    font: 13px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
    opacity: 0; pointer-events: none; cursor: pointer;
    transition: opacity .2s ease, transform .4s cubic-bezier(.3,1.2,.5,1);
  }
  #bubble::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(220px 160px at 50% 135%, var(--wash, rgba(99,102,241,.45)), transparent 70%);
  }
  #bubble > * { position: relative; }
  #bubble.show { opacity: 1; transform: translateX(-50%) translateY(0) scale(1); pointer-events: auto; }
  #bubble.alert { --wash: rgba(245,165,36,.5); }
  #bubble.good { --wash: rgba(52,211,153,.5); }
  #bubble.bad { --wash: rgba(244,80,94,.55); }
  #bubble .title { font-weight: 600; font-size: 13.5px; margin: 0 14px 2px 0; }
  #bubble .body { color: #9398A1; font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }
  #bubble .close { position: absolute; top: 7px; right: 10px; color: #6B7079; font-size: 13px; line-height: 1; }
  #bubble .close:hover { color: #F5F6F8; }
  #bubble .act { display: inline-block; margin-top: 8px; padding: 4px 11px; border-radius: 999px; background: #F5F6F8; color: #0B0C0E; font-size: 11.5px; font-weight: 600; }
  #bubble .act:empty { display: none; }
  @media (prefers-color-scheme: light) {
    #bubble { background: #FFFFFF; color: #16171B; box-shadow: 0 8px 26px rgba(17,18,23,.16), inset 0 0 0 1px rgba(17,18,23,.07); }
    #bubble .body { color: #5D626B; }
    #bubble .act { background: #1C1D22; color: #F7F7F9; }
    #bubble.alert { --wash: rgba(245,165,36,.22); }
    #bubble.good { --wash: rgba(52,211,153,.22); }
    #bubble.bad { --wash: rgba(244,80,94,.2); }
    #bubble { --wash: rgba(99,102,241,.16); }
  }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="bubble" role="status" aria-live="polite"><span class="close" aria-hidden="true">✕</span><div class="title"></div><div class="body"></div><span class="act"></span></div>
  <script type="module" src="./companion.js"></script>
</body>
</html>
