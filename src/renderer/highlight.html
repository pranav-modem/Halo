<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'" />
<title>Halo Highlight</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  .ring {
    position: absolute; inset: 3px; border-radius: 12px;
    border: 3px solid rgba(167, 139, 250, 0.95);
    background: rgba(124, 58, 237, 0.10);
    box-shadow: 0 0 0 6px rgba(167, 139, 250, 0.22), inset 0 0 40px rgba(124, 58, 237, 0.18);
    animation: in .16s ease-out;
  }
  @keyframes in { from { opacity: 0; transform: scale(.985); } }
</style>
</head>
<body><div class="ring"></div></body>
</html>
