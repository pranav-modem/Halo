<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:" />
<title>Snip a Region</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; cursor: crosshair; user-select: none; background: #000; }
  #shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; }
  #shade { position: absolute; inset: 0; background: rgba(10,8,30,.45); }
  #box { position: absolute; display: none; outline: 2px solid #A78BFA; box-shadow: 0 0 0 9999px rgba(10,8,30,.45); background: transparent; }
  #hint { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px;
          background: rgba(28,24,48,.88); color: #fff; font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; }
  #size { position: absolute; display: none; padding: 2px 6px; border-radius: 6px; background: #7C3AED; color: #fff; font: 11px system-ui, sans-serif; }
</style>
</head>
<body>
  <img id="shot" alt="" />
  <div id="shade"></div>
  <div id="box"></div>
  <div id="size"></div>
  <div id="hint">Drag to select an area. Press Esc to cancel.</div>
  <script type="module" src="./snip.js"></script>
</body>
</html>
